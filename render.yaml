services:
  # 1. Backend Web Service
  - type: web
    name: reachinbox-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma db push && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_EMAIL_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 50
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString

  # 2. Frontend Static Site
  - type: web
    name: reachinbox-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Database
  - name: reachinbox-postgres
    plan: free
    databaseName: reachinbox
    user: postgres

# 4. Redis Service
  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList: [] # internal only
